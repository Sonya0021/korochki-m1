<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход — Парикмахерская «Стиль»</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header><h1>Парикмахерская «Стиль» — Запись к стилистам</h1></header>
<div class="container auth-box">
    <h2>Авторизация</h2>
    <form id="loginForm">
        <label>Логин</label>
        <input type="text" id="login" required placeholder="Введите логин">
        <label>Пароль</label>
        <input type="password" id="password" required placeholder="Введите пароль">
        <button type="submit" class="primary">Войти</button>
    </form>
    <div id="msg" class="msg"></div>
    <div class="link-row">Нет аккаунта? <a href="/register">Зарегистрироваться</a></div>
</div>
<script>
document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            login: document.getElementById('login').value,
            password: document.getElementById('password').value
        })
    });
    const data = await res.json();
    const msg = document.getElementById('msg');
    if (!res.ok) {
        msg.className = 'msg error';
        msg.textContent = data.error;
        return;
    }
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = data.user.role === 'admin' ? '/admin' : '/applications';
};
</script>
</body>
</html>
